# Optional FIFO fallback: expose the PCM written by lgmagicd as a source.
# module-pipe-tunnel opens the FIFO read-write, so members of the lgmagic
# group can both read and write /run/lgmagic/voice.pcm.
context.modules = [
{ name = libpipewire-module-pipe-tunnel
  flags = [ nofail ]
  args = {
    tunnel.mode = source
    tunnel.may-pause = true
    pipe.filename = "/run/lgmagic/voice.pcm"
    audio.format = S16LE
    audio.rate = 16000
    audio.channels = 1
    audio.position = [ MONO ]
    node.name = "lg-magic-voice-fifo"
    node.description = "LG Magic Remote microphone (FIFO fallback)"
  }
}
]
