<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- lgmagicd owns the vendor voice interface.  Any local process may send
       to it, but Acquire() itself only succeeds for the active logind
       session (or the daemon user/root).  Only the daemon touches hidraw. -->
  <policy user="root">
    <allow own="org.lgmagic"/>
    <allow send_destination="org.lgmagic"/>
  </policy>
  <policy user="lgmagic">
    <allow own="org.lgmagic"/>
    <allow send_destination="org.lgmagic"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.lgmagic"/>
  </policy>
</busconfig>
