# WirePlumber source for the LG Magic Remote microphone.
#
# The module is a normal PipeWire module, but WirePlumber loads it as a
# "pw-module-client" component so that it runs in the client context, on its
# own thread, without a separate user service.  It acquires the read-only PCM
# pipe from lgmagicd over the system bus; the daemon is the only process that
# touches hidraw and the only process that can arm the microphone.
#
# The source is deliberately low priority so it does not become the default
# microphone.  Select it explicitly, or use "wpctl set-default", when needed.

wireplumber.profiles = {
  main = { lgmagic = required }
}

wireplumber.components = [
  {
    type = virtual
    provides = lgmagic
    wants = [ lgmagic.voice ]
  }
  {
    name = libpipewire-module-lgmagic
    type = pw-module-client
    provides = lgmagic.voice
    requires = [ support.client-context ]
    arguments = {
      node.name = "lg-magic-voice"
      node.description = "LG Magic Remote microphone"
      priority.session = 0
    }
  }
]
